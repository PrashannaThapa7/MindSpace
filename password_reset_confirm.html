{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>New Password — MindSpace</title>
  <link rel="stylesheet" href="{% static 'css/login.css' %}"/>
</head>
<body>

<main class="card">
  <header>
    <div class="logo">🔒</div>
    <h2>Set New Password</h2>
    <p>Choose a secure password.</p>
  </header>

  {% if validlink %}
  <form method="POST" onsubmit="return checkMatch()">
    {% csrf_token %}
    
    <div class="field">
      <label>New Password</label>
      <input type="password" id="p1" name="new_password1" placeholder="••••••••" required/>
    </div>

    <div class="field">
      <label>Confirm Password</label>
      <input type="password" id="p2" name="new_password2" placeholder="••••••••" required oninput="checkMatch()"/>
      <p id="msg" style="font-size:0.8rem; margin-top:0.3rem"></p>
    </div>

    {% if form.errors %}
      <p class="err">{{ form.errors.new_password2|striptags }}</p>
    {% endif %}

    <button type="submit">Update Password</button>
  </form>

  <script>
    const p1 = document.getElementById('p1'), p2 = document.getElementById('p2'), msg = document.getElementById('msg');
    function checkMatch() {
      if (!p2.value) { msg.textContent = ''; return true; }
      const match = p1.value === p2.value;
      msg.style.color = match ? 'green' : 'red';
      msg.textContent = match ? '✓ Passwords match' : '✗ Passwords do not match';
      return match;
    }
  </script>

  {% else %}
  <p class="err">This link is invalid or expired.</p>
  <footer>
    <a href="{% url 'password_reset' %}" class="back">Request a new link</a>
  </footer>
  {% endif %}
</main>

</body>
</html>
