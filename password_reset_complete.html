{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Reset Complete — MindSpace</title>
  <link rel="stylesheet" href="{% static 'css/login.css' %}"/>
</head>
<body>

<main class="card">
  <header>
    <div class="logo">✅</div>
    <h2>Password Changed!</h2>
    <p>Your password is set. Redirecting to login...</p>
  </header>

  <footer>
    <a href="{% url 'login' %}" class="back">Go to Login Now</a>
  </footer>
</main>

<script>
  // Wait 2 seconds, then redirect to login page
  setTimeout(() => {
    window.location.href = "{% url 'login' %}";
  }, 2000);
</script>

</body>
</html>
